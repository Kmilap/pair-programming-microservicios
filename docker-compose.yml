# ============================================================
# docker-compose.yml — Pair Programming Microservicios
# Fase 2 — Arquitectura de Software UNAB
# ============================================================

services:
  # ----------------------------------------------------------
  # DOCKER SOCKET PROXY — Acceso seguro al daemon
  # ----------------------------------------------------------
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: pp_docker_socket_proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      NETWORKS: 1
      SERVICES: 1
      TASKS: 1
      INFO: 1
      VERSION: 1
      POST: 0
      BUILD: 0
      COMMIT: 0
      EXEC: 0
      VOLUMES: 0
      IMAGES: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # API GATEWAY — Traefik
  # ----------------------------------------------------------
  traefik:
    image: traefik:v2.11
    container_name: pp_traefik
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.endpoint=tcp://docker-socket-proxy:2375"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=pp_app_network"
      - "--entrypoints.web.address=:80"
      - "--api.dashboard=true"
      - "--api.insecure=true"
      - "--log.level=INFO"
      - "--accesslog=true"
    ports:
      - "80:80"
      - "8080:8080"
    networks:
      - app-network
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:8080/api/rawdata"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # DATABASE — PostgreSQL para Auth
  # ----------------------------------------------------------
  postgres-auth:
    image: postgres:16-alpine
    container_name: pp_postgres_auth
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_AUTH_DB}
      POSTGRES_USER: ${POSTGRES_AUTH_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AUTH_USER} -d ${POSTGRES_AUTH_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # MICROSERVICIO — Auth (Laravel 12 + JWT)
  # ----------------------------------------------------------
  auth:
    build:
      context: ./services/auth
      dockerfile: Dockerfile
    container_name: pp_auth
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${AUTH_APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres-auth
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_AUTH_DB}
      DB_USERNAME: ${POSTGRES_AUTH_USER}
      DB_PASSWORD: ${POSTGRES_AUTH_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      JWT_BLACKLIST_ENABLED: "false"
      CACHE_STORE: array
      LOG_CHANNEL: stderr
    depends_on:
      postgres-auth:
        condition: service_healthy
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.auth.rule=PathPrefix(`/auth`)"
      - "traefik.http.routers.auth.entrypoints=web"
      - "traefik.http.services.auth.loadbalancer.server.port=8000"
      # MIDDLEWARE CORS
      - "traefik.http.middlewares.cors.headers.accesscontrolalloworiginlist=http://localhost:5173"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.cors.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.cors.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors.headers.addvaryheader=true"
      - "traefik.http.routers.auth.middlewares=cors"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://localhost:8000/auth/health') ? 0 : 1);\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  # DATABASE — PostgreSQL para Pair Programming
  # ----------------------------------------------------------
  postgres-pp:
    image: postgres:16-alpine
    container_name: pp_postgres_pp
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_PP_DB}
      POSTGRES_USER: ${POSTGRES_PP_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PP_PASSWORD}
    volumes:
      - postgres_pp_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_PP_USER} -d ${POSTGRES_PP_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # DATABASE — PostgreSQL para AI Engine
  # ----------------------------------------------------------
  postgres-ai:
    image: postgres:16-alpine
    container_name: pp_postgres_ai
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_AI_DB}
      POSTGRES_USER: ${POSTGRES_AI_USER}
      POSTGRES_PASSWORD: ${POSTGRES_AI_PASSWORD}
    volumes:
      - postgres_ai_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_AI_USER} -d ${POSTGRES_AI_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------
  # MESSAGE BROKER — RabbitMQ
  # ----------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pp_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # CACHE / STATE — Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: pp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------
  # MICROSERVICIO — Editor Colaborativo (Node + Express)
  # ----------------------------------------------------------
  editor:
    build:
      context: ./services/editor
      dockerfile: Dockerfile
    container_name: pp_editor
    restart: unless-stopped
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      # Servicio único apuntando al puerto 3000
      - "traefik.http.services.editor.loadbalancer.server.port=3000"
      # Router REST + WebSocket (Traefik v2 hace upgrade WS automáticamente)
      - "traefik.http.routers.editor.rule=PathPrefix(`/editor`)"
      - "traefik.http.routers.editor.entrypoints=web"
      - "traefik.http.routers.editor.service=editor"
      # CORS
      - "traefik.http.middlewares.cors-editor.headers.accesscontrolalloworiginlist=http://localhost:5173"
      - "traefik.http.middlewares.cors-editor.headers.accesscontrolallowmethods=GET,POST,OPTIONS"
      - "traefik.http.middlewares.cors-editor.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.cors-editor.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors-editor.headers.addvaryheader=true"
      - "traefik.http.routers.editor.middlewares=cors-editor"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/editor/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------------------------------------------
  # MICROSERVICIO — Pair Programming (Laravel 12 + PHP 8.3)
  # ----------------------------------------------------------
  pair-programming:
    build:
      context: ./services/pair-programming
      dockerfile: Dockerfile
    container_name: pp_pair_programming
    restart: unless-stopped
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${PP_APP_KEY}
      APP_URL: http://localhost
      LOG_CHANNEL: stderr
      LOG_LEVEL: debug
      DB_CONNECTION: pgsql
      DB_HOST: postgres-pp
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_PP_DB}
      DB_USERNAME: ${POSTGRES_PP_USER}
      DB_PASSWORD: ${POSTGRES_PP_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL}
      JWT_BLACKLIST_ENABLED: "false"
      CACHE_STORE: array
      SESSION_DRIVER: array
      AUTH_SERVICE_URL: http://auth:8000
      EDITOR_SERVICE_URL: http://editor:3000
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres-pp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/pair-programming:/app
      - /app/vendor
    networks:
      - app-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pair-programming.rule=PathPrefix(`/sessions`) || PathPrefix(`/exercises`)"
      - "traefik.http.routers.pair-programming.entrypoints=web"
      - "traefik.http.services.pair-programming.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.cors-pp.headers.accesscontrolalloworiginlist=http://localhost:5173"
      - "traefik.http.middlewares.cors-pp.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.cors-pp.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.cors-pp.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors-pp.headers.addvaryheader=true"
      - "traefik.http.routers.pair-programming.middlewares=cors-pp"
    healthcheck:
      test: ["CMD-SHELL", "php -r \"exit(@file_get_contents('http://127.0.0.1:8000/sessions/health') ? 0 : 1);\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # ----------------------------------------------------------
  # MICROSERVICIO — AI Engine (Python + FastAPI + Circuit Breaker)
  # ----------------------------------------------------------
  ai-engine:
    build:
      context: ./services/ai-engine
      dockerfile: Dockerfile
    container_name: pp_ai_engine
    restart: unless-stopped
    networks:
      - app-network
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ai.rule=PathPrefix(`/ai`)"
      - "traefik.http.routers.ai.entrypoints=web"
      - "traefik.http.services.ai.loadbalancer.server.port=8000"
      - "traefik.http.middlewares.cors-ai.headers.accesscontrolalloworiginlist=http://localhost:5173"
      - "traefik.http.middlewares.cors-ai.headers.accesscontrolallowmethods=GET,POST,PUT,DELETE,OPTIONS"
      - "traefik.http.middlewares.cors-ai.headers.accesscontrolallowheaders=Content-Type,Authorization"
      - "traefik.http.middlewares.cors-ai.headers.accesscontrolmaxage=100"
      - "traefik.http.middlewares.cors-ai.headers.addvaryheader=true"
      - "traefik.http.routers.ai.middlewares=cors-ai"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ai/health')\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ----------------------------------------------------------
  # WORKER — Outbox Publisher (Transactional Outbox)
  # ----------------------------------------------------------
  pair-outbox-worker:
    build:
      context: ./services/pair-programming
      dockerfile: Dockerfile
    container_name: pp_pair_outbox_worker
    restart: unless-stopped
    command: ["sh", "-c", "php artisan outbox:publish --loop"]
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${PP_APP_KEY}
      LOG_CHANNEL: stderr
      LOG_LEVEL: info
      DB_CONNECTION: pgsql
      DB_HOST: postgres-pp
      DB_PORT: 5432
      DB_DATABASE: ${POSTGRES_PP_DB}
      DB_USERNAME: ${POSTGRES_PP_USER}
      DB_PASSWORD: ${POSTGRES_PP_PASSWORD}
      CACHE_STORE: array
      SESSION_DRIVER: array
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    depends_on:
      postgres-pp:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./services/pair-programming:/app
      - /app/vendor
    networks:
      - app-network

# ============================================================
# PERSISTENCIA Y REDES
# ============================================================
volumes:
  postgres_auth_data:
    name: pp_postgres_auth_data
  postgres_pp_data:
    name: pp_postgres_pp_data
  postgres_ai_data:
    name: pp_postgres_ai_data
  rabbitmq_data:
    name: pp_rabbitmq_data
  redis_data:
    name: pp_redis_data

networks:
  app-network:
    name: pp_app_network
    driver: bridge