[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:php-server]
; API HTTP — responde GET /notifications?userId=X y /notifications/health
command=php -S 0.0.0.0:8000 -t /var/www/html/public /var/www/html/public/index.php
directory=/var/www/html
autostart=true
autorestart=true
startretries=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

[program:notifications-worker]
; Consumer RabbitMQ — patrón Choreography (session.started / session.ended → B5)
command=php /var/www/html/artisan notifications:consume
directory=/var/www/html
autostart=true
autorestart=true
startretries=20
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
